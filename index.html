<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#08090d" />
  <title>N-body · Gravity simulation</title>
  <script type="module" crossorigin src="/nBodyWebGPU/assets/index-kwu-lMzu.js"></script>
  <link rel="stylesheet" crossorigin href="/nBodyWebGPU/assets/index-Fyp--hau.css">
</head>
<body>
  <details id="ui" open aria-label="Simulation controls">
    <summary class="panel-header" title="Show or hide controls">
      <svg class="app-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <ellipse cx="16" cy="16" rx="13" ry="6" transform="rotate(-35 16 16)" />
        <ellipse cx="16" cy="16" rx="6" ry="13" transform="rotate(-35 16 16)" />
        <circle cx="16" cy="16" r="2.5" />
      </svg>
      <span class="brand-copy">
        <span class="app-title">N-body</span>
        <span class="app-subtitle">Gravity simulation</span>
      </span>
      <span class="performance" aria-label="Frames per second">
        <span id="fpsText">—</span><span class="fps-unit">fps</span>
      </span>
      <svg class="panel-chevron" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="m4 6 4 4 4-4" />
      </svg>
    </summary>

    <div class="panel-content">
      <section class="control-section" aria-labelledby="particleLabel">
        <div class="control-heading">
          <h2 id="particleLabel">Particles</h2>
          <output id="bodiesText" class="readout">131,072</output>
        </div>
        <div id="bodyCountButtons" role="group" aria-labelledby="particleLabel">
          <button type="button" value="131072" aria-pressed="true">128k</button>
          <button type="button" value="524288" aria-pressed="false">512k</button>
          <button type="button" value="1048576" aria-pressed="false">1mil</button>
        </div>
      </section>

      <section class="control-section gravity-control">
        <div class="control-heading">
          <label for="gravitySlider">Gravity</label>
          <output id="gravityText" class="readout gravity-value" for="gravitySlider">5</output>
        </div>
        <input type="range" id="gravitySlider" min="1" max="100" value="5" />
        <div class="range-labels" aria-hidden="true"><span>Gentle</span><span>Strong</span></div>
      </section>

      <label class="switch-row" for="twinGalaxiesToggle">
        <span>Twin galaxies</span>
        <input type="checkbox" id="twinGalaxiesToggle" role="switch" />
      </label>

      <button id="restartButton" type="button">
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M4 7a6.5 6.5 0 1 1-.4 5M4 3v4h4" />
        </svg>
        Restart simulation
      </button>
      <div class="navigation-hint"><span>Drag to look</span><span><kbd>WASD</kbd> to move</span></div>
    </div>
  </details>

  <a href="https://github.com/jtsorlinis/nBodyWebGPU" target="_blank" rel="noopener noreferrer" id="sourceButton" aria-label="View source on GitHub (opens in a new tab)">
    <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
      <path d="m6 6-4 4 4 4m8-8 4 4-4 4M12 3 8 17" />
    </svg>
    <span>View source</span>
    <span class="external-arrow" aria-hidden="true">↗</span>
  </a>
  <canvas id="renderCanvas" aria-label="Interactive galaxy simulation"></canvas>
</body>
</html>
