        <div class="control-heading">
          <label for="gravitySlider">Gravity</label>
          <output id="gravityText" class="readout gravity-value" for="gravitySlider">5</output>
        </div>
        <input type="range" id="gravitySlider" min="1" max="100" value="5" />
        <div class="range-labels" aria-hidden="true"><span>Gentle</span><span>Strong</span></div>
      </section>

      <label class="switch-row" for="twinGalaxiesToggle">
        <span>Twin galaxies</span>
        <input type="checkbox" id="twinGalaxiesToggle" role="switch" />
      </label>

      <button id="restartButton" type="button">
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M4 7a6.5 6.5 0 1 1-.4 5M4 3v4h4" />
        </svg>
        Restart simulation
      </button>
      <div class="navigation-hint"><span>Drag to look</span><span><kbd>WASD</kbd> to move</span></div>
    </div>
  </details>

  <a href="https://github.com/jtsorlinis/nBodyWebGPU" target="_blank" rel="noopener noreferrer" id="sourceButton" aria-label="View source on GitHub (opens in a new tab)">
    <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
      <path d="m6 6-4 4 4 4m8-8 4 4-4 4M12 3 8 17" />
    </svg>
    <span>View source</span>
    <span class="external-arrow" aria-hidden="true">↗</span>
  </a>
  <canvas id="renderCanvas" touch-action="none" aria-label="Interactive galaxy simulation"></canvas>
</body>
</html>
